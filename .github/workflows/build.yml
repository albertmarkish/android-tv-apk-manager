name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Ubuntu runner already ships the Android SDK; Gradle fetches any missing platform.
      - uses: gradle/actions/setup-gradle@v4

      # Every build is signed with the one release key, so it installs over any earlier release.
      # Without the secret (for example on a fork) Gradle falls back to the debug key.
      - name: Unpack the signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 isn't set, so this build is signed with a throwaway debug key and can't be released."
          fi

      - name: Test scanning rules and build the APKs
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: ./gradlew :core:test :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-apk-manager-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      # Each new versionName merged to main becomes a GitHub release, which the app checks for updates.
      - name: Publish a release for a new version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ -z "$version" ]; then
            echo "::error::Couldn't read versionName from app/build.gradle.kts"
            exit 1
          fi
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released. Bump versionName to publish a new one."
            exit 0
          fi
          if [ "$SIGNED" != "true" ]; then
            echo "::error::Add the RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD secrets to publish releases."
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "apk-manager-$version.apk"
          gh release create "v$version" "apk-manager-$version.apk" \
            --title "APK Manager $version" \
            --target "$GITHUB_SHA" \
            --generate-notes
