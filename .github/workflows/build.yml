name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Ubuntu runner already ships the Android SDK; Gradle fetches any missing platform.
      - uses: gradle/actions/setup-gradle@v4

      - name: Test scanning rules and build the APK
        run: ./gradlew :core:test :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-apk-manager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
